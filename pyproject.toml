[project]
name = "qaoa-cardinality"
version = "0.1.0"
description = "Cardinality-Constrained QAOA and Distribution-Aware Evaluation"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Asymmetrica Investments, Francisco"}]
maintainers = [{name = "Guillem Cucurull Llovera"}]
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2"]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "build>=1.2"]
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: longer synthetic numerical validation"]
